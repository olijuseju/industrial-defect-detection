[project]
name = "industrial-defect-detection"
version = "0.1.0"
description = "Industrial defect detection with YOLO: training pipeline, FastAPI service and Docker deployment."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "opencv-python>=5.0.0.93",
    "pyyaml>=6.0.3",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "ultralytics>=8.4.174",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.142.2",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/defect_detection"]

# --- PyTorch CPU en local ---
# En local solo se desarrolla, se testea y se sirve el modelo, así que basta la build CPU
# (mucho más ligera que la de CUDA). El entrenamiento se hace en Google Colab (GPU) con
# `pip install -e .`: pip ignora [tool.uv.sources] y usa el torch+CUDA que ya trae Colab.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]   # errores, imports ordenados, bugs comunes, sintaxis moderna

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
